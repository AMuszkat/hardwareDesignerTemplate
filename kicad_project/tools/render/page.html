<title>{{TITLE}} Render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a drawing sheet. One column, the hero shot full width, the other
   views in a two-up grid, then the title-block facts and the body list. */
:root {
  --bg: #f1f4f2; --panel: #ffffff; --fg: #141c18; --muted: #5b6861; --line: #d3dad6;
  --accent: #1c6a45; --shot: #dfe4e1;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --panel: #161c19; --fg: #e5ebe7; --muted: #93a099; --line: #27312c;
    --accent: #62c392; --shot: #222a26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --panel: #161c19; --fg: #e5ebe7; --muted: #93a099; --line: #27312c;
  --accent: #62c392; --shot: #222a26; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
.sheet { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 32px 48px; display: grid; gap: 28px; }
.sheet > * { min-width: 0; }
header { display: grid; gap: 4px; border-bottom: 2px solid var(--fg); padding-bottom: 14px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.05 var(--display); letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.sub { font: 13px/1.4 var(--mono); color: var(--muted); margin: 0; overflow-wrap: anywhere; }
h2 { font: 600 13px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
figcaption { font: 500 13px/1.3 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.shot { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--shot);
  cursor: zoom-in; overflow: hidden; }
.shot img { display: block; width: 100%; height: auto; }
.shot:focus-visible, dialog button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.views { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; align-items: start; }
dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--line);
  border-radius: 4px; background: var(--panel); }
dl div { padding: 12px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
dt { font: 500 11px/1.2 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
dd { margin: 4px 0 0; font: 500 14px/1.35 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bodies p { max-width: 68ch; margin: 0 0 12px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:nth-child(2), td:nth-child(4) { overflow-wrap: anywhere; }
th { font: 500 11px/1.2 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
td.refs { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
.warn { margin: 0; padding: 12px 16px 12px 32px; border-left: 3px solid var(--accent); background: var(--panel); max-width: 80ch; }
footer { font: 12px/1.5 var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; overflow-wrap: anywhere; }
dialog { border: 0; padding: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; background: var(--bg); color: var(--fg); }
dialog::backdrop { background: var(--bg); }
dialog .pane { width: 100%; height: 100%; overflow: auto; display: grid; place-items: center; cursor: zoom-in; }
dialog .pane.actual { place-items: start; cursor: zoom-out; }
dialog img { display: block; max-width: 100%; max-height: 100%; }
dialog .pane.actual img { max-width: none; max-height: none; }
dialog button { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; font: 500 13px/1 var(--body);
  padding: 9px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); cursor: pointer; }
</style>
<main class="sheet">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUB}}</p>
  </header>
  {{HERO}}
  <section class="views" aria-label="Other views">{{GALLERY}}</section>
  <section aria-labelledby="h-facts">
    <h2 id="h-facts">Board</h2>
    <dl>{{FACTS}}</dl>
  </section>
  <section class="bodies" aria-labelledby="h-bodies">
    <h2 id="h-bodies">Part bodies</h2>
    {{BODIES}}
    {{WARNINGS}}
  </section>
  <footer>{{FOOT}}</footer>
</main>
<dialog id="viewer" aria-label="Enlarged view">
  <div class="pane" id="pane"><img id="full" alt=""></div>
  <button type="button" id="close">Close</button>
</dialog>
<script>
(function () {
  var dlg = document.getElementById("viewer"), pane = document.getElementById("pane"), full = document.getElementById("full");
  document.querySelectorAll(".shot").forEach(function (b) {
    b.addEventListener("click", function () {
      full.src = b.dataset.full;
      full.alt = b.querySelector("img").alt;
      pane.classList.remove("actual");
      if (dlg.showModal) dlg.showModal();
    });
  });
  pane.addEventListener("click", function () { pane.classList.toggle("actual"); });
  document.getElementById("close").addEventListener("click", function () { dlg.close(); });
})();
</script>
